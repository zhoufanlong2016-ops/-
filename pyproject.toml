[project]
name = "document-translator"
version = "0.1.0"
description = "Minimal project skeleton for a document translator."
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx",
    "marko",
    "mineru>=4.0,<5",
    "pydantic",
    "pymupdf<1.25.3",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
document-translator = "document_translator.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
document_translator = ["assets/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
