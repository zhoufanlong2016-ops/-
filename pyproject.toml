[project]
name = "document-translator"
version = "0.1.0"
description = "Minimal project skeleton for a document translator."
requires-python = ">=3.13,<3.14"
dependencies = [
    "httpx",
    "marko",
    "pydantic",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
